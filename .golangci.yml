version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      # A deferred Close on a read path has nowhere to report to.
      - linters: [errcheck]
        source: '^\s*defer .*\.Close\(\)$'
      - path: _test\.go$
        linters:
          - errcheck
          - wastedassign
